name: Instalar plataforma AfriMosa

on:
  push:
    paths:
      - afrimosa-source.tar.xz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Verificar pacote
        run: echo 'fd7d7bc4cfa206184a41f4cd34d2b49989340eef3c7e92bbf9dbfed2e853a123  afrimosa-source.tar.xz' | sha256sum --check
      - name: Extrair arquivos e publicar
        run: |
          set -euo pipefail
          tar -xJf afrimosa-source.tar.xz
          test -f index.html
          test -f admin/index.html
          test -f data/canal.json
          python3 -m json.tool data/canal.json > /dev/null
          rm -f afrimosa-source.tar.xz
          rm -f .github/workflows/install-afrimosa.yml
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: publicar plataforma AfriMosa TV'
            git push
          fi
